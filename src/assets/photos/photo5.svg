<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A213B" />
      <stop offset="50%" stop-color="#281729" />
      <stop offset="100%" stop-color="#170C18" />
    </linearGradient>
    <linearGradient id="gold5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEAA7" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#8E5E12" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg5)" />
  <rect x="30" y="30" width="740" height="540" rx="16" fill="none" stroke="url(#gold5)" stroke-width="2" stroke-dasharray="8 6" opacity="0.6" />
  <rect x="45" y="45" width="710" height="510" rx="12" fill="none" stroke="url(#gold5)" stroke-width="1" opacity="0.3" />

  <!-- Fireworks & Celebration Lanterns -->
  <g transform="translate(400, 230)">
    <circle cx="0" cy="0" r="80" fill="rgba(244, 194, 194, 0.12)" />
    <!-- Sparks Burst -->
    <path d="M0,-60 L0,-40 M0,60 L0,40 M-60,0 L-40,0 M60,0 L40,0 M-42,-42 L-28,-28 M42,42 L28,28 M-42,42 L-28,28 M42,-42 L28,-28" stroke="url(#gold5)" stroke-width="3" stroke-linecap="round" />
    <circle cx="0" cy="0" r="18" fill="none" stroke="url(#gold5)" stroke-width="3" />
    <circle cx="0" cy="0" r="8" fill="#FFF8F0" />
    <!-- Festive ribbon bows -->
    <path d="M-25,25 Q-40,45 -20,55 Q0,45 -5,25 Z" fill="#F4C2C2" opacity="0.7" />
    <path d="M25,25 Q40,45 20,55 Q0,45 5,25 Z" fill="#F4C2C2" opacity="0.7" />
  </g>

  <text x="400" y="420" font-family="'Cairo', sans-serif" font-size="34" font-weight="bold" fill="url(#gold5)" text-anchor="middle">
    فرحة العمر وليلة البهجة 🎊💖
  </text>
  <text x="400" y="465" font-family="'Cairo', sans-serif" font-size="20" fill="#FFF8F0" opacity="0.8" text-anchor="middle">
    تتعالى الزغاريد وتكتمل الفرحة بزفاف مشاعر
  </text>
  <text x="400" y="515" font-family="'Cairo', sans-serif" font-size="14" fill="#D4AF37" opacity="0.6" text-anchor="middle">
    (صورة توضيحية - يمكنك استبدالها بصورة حقيقية)
  </text>
</svg>
