<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#261829" />
      <stop offset="50%" stop-color="#321D35" />
      <stop offset="100%" stop-color="#190F1C" />
    </linearGradient>
    <linearGradient id="gold4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3D6" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA771C" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg4)" />
  <rect x="30" y="30" width="740" height="540" rx="16" fill="none" stroke="url(#gold4)" stroke-width="2" stroke-dasharray="8 6" opacity="0.6" />
  <rect x="45" y="45" width="710" height="510" rx="12" fill="none" stroke="url(#gold4)" stroke-width="1" opacity="0.3" />

  <!-- Sparkling Hearts & Stars -->
  <g transform="translate(400, 230)">
    <circle cx="0" cy="0" r="85" fill="rgba(212, 175, 55, 0.1)" />
    <!-- Center Big Heart -->
    <path d="M0,35 C-60,-20 -50,-65 -20,-65 C-5,-65 0,-45 0,-45 C0,-45 5,-65 20,-65 C50,-65 60,-20 0,35 Z" fill="none" stroke="url(#gold4)" stroke-width="4" />
    <path d="M0,25 C-45,-15 -40,-50 -15,-50 C-4,-50 0,-35 0,-35 C0,-35 4,-50 15,-50 C40,-50 45,-15 0,25 Z" fill="rgba(244, 194, 194, 0.4)" />
    
    <!-- Sparkles -->
    <path d="M-60,-40 L-50,-35 L-60,-30 L-70,-35 Z" fill="url(#gold4)" />
    <path d="M60,-40 L70,-35 L60,-30 L50,-35 Z" fill="url(#gold4)" />
    <path d="M-40,25 L-35,35 L-40,45 L-45,35 Z" fill="url(#gold4)" />
    <path d="M40,25 L45,35 L40,45 L35,35 Z" fill="url(#gold4)" />
  </g>

  <text x="400" y="420" font-family="'Cairo', sans-serif" font-size="34" font-weight="bold" fill="url(#gold4)" text-anchor="middle">
    أجمل الذكريات والضحكات ✨🕊️
  </text>
  <text x="400" y="465" font-family="'Cairo', sans-serif" font-size="20" fill="#FFF8F0" opacity="0.8" text-anchor="middle">
    محفورة في القلب كأغلى الأماني وأحلى الأيام
  </text>
  <text x="400" y="515" font-family="'Cairo', sans-serif" font-size="14" fill="#D4AF37" opacity="0.6" text-anchor="middle">
    (صورة توضيحية - يمكنك استبدالها بصورة حقيقية)
  </text>
</svg>
