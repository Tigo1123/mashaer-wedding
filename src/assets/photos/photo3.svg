<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#341E34" />
      <stop offset="50%" stop-color="#261628" />
      <stop offset="100%" stop-color="#180D19" />
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE4E1" />
      <stop offset="50%" stop-color="#F4C2C2" />
      <stop offset="100%" stop-color="#E89898" />
    </linearGradient>
    <linearGradient id="gold3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE0AD" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg3)" />
  <rect x="30" y="30" width="740" height="540" rx="16" fill="none" stroke="url(#gold3)" stroke-width="2" stroke-dasharray="8 6" opacity="0.6" />
  <rect x="45" y="45" width="710" height="510" rx="12" fill="none" stroke="url(#gold3)" stroke-width="1" opacity="0.3" />

  <!-- Bouquet Motif -->
  <g transform="translate(400, 230)">
    <circle cx="0" cy="0" r="80" fill="rgba(244, 194, 194, 0.1)" />
    <!-- Roses -->
    <circle cx="0" cy="-30" r="32" fill="url(#roseGrad)" opacity="0.9" />
    <circle cx="-35" cy="5" r="28" fill="url(#roseGrad)" opacity="0.85" />
    <circle cx="35" cy="5" r="28" fill="url(#roseGrad)" opacity="0.85" />
    <circle cx="-18" cy="38" r="24" fill="url(#roseGrad)" opacity="0.95" />
    <circle cx="18" cy="38" r="24" fill="url(#roseGrad)" opacity="0.95" />

    <!-- Rose spirals -->
    <path d="M0,-30 m-12,0 a 12,12 0 1,0 24,0 a 12,12 0 1,0 -24,0" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.6" />
    <path d="M-35,5 m-10,0 a 10,10 0 1,0 20,0 a 10,10 0 1,0 -20,0" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.6" />
    <path d="M35,5 m-10,0 a 10,10 0 1,0 20,0 a 10,10 0 1,0 -20,0" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.6" />
    
    <!-- Leaves -->
    <path d="M-50,-20 Q-70,-40 -50,-50 Q-35,-35 -50,-20 Z" fill="#7C9D86" opacity="0.8" />
    <path d="M50,-20 Q70,-40 50,-50 Q35,-35 50,-20 Z" fill="#7C9D86" opacity="0.8" />
    <path d="M0,65 Q-20,95 0,110 Q20,95 0,65 Z" fill="url(#gold3)" opacity="0.8" />
  </g>

  <text x="400" y="420" font-family="'Cairo', sans-serif" font-size="34" font-weight="bold" fill="url(#gold3)" text-anchor="middle">
    باقة ورد ودعوات مباركة 💐🤍
  </text>
  <text x="400" y="465" font-family="'Cairo', sans-serif" font-size="20" fill="#FFF8F0" opacity="0.8" text-anchor="middle">
    وردة بيضاء لكل ابتسامة ولكل لحظة تجمعنا
  </text>
  <text x="400" y="515" font-family="'Cairo', sans-serif" font-size="14" fill="#D4AF37" opacity="0.6" text-anchor="middle">
    (صورة توضيحية - يمكنك استبدالها بصورة حقيقية)
  </text>
</svg>
